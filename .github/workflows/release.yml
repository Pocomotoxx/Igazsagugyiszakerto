name: Windows telepítő

# Egy kattintásos telepítő-készítés a GitHubon: nem kell hozzá Rust, Node vagy PowerShell a gépeden.
#  - Kézzel: GitHub → Actions → "Windows telepítő" → Run workflow
#  - Címkével: git tag v0.1.0 && git push origin v0.1.0  (vázlat-kiadás készül a setup.exe-vel)
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Rust eszközlánc
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Függőségek
        run: npm ci

      - name: Telepítő építése (NSIS)
        run: npm run tauri build

      - name: Telepítő mentése (letölthető a futás oldalán)
        uses: actions/upload-artifact@v4
        with:
          name: IRBR-telepito
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Vázlat-kiadás (csak címkénél)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: src-tauri/target/release/bundle/nsis/*.exe
