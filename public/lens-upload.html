<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Lens</title>
  <style>
    body { font-family: system-ui, "Segoe UI", sans-serif; margin: 0; padding: 2rem; color: #111827; background: #fff; }
    .warn { background: #dc2626; color: #fff; font-weight: 700; padding: .75rem 1rem; border-radius: .5rem; margin-bottom: 1.25rem; }
  </style>
</head>
<body>
  <div class="warn" role="alert">
    FIGYELEM: ez csak képes keresés, NEM helyettesíti a szakszerű gyógyszerazonosítást.
    Ismeretlen gyógyszert ne vegyen be és ne adjon be senkinek. Veszély esetén: 112.
  </div>
  <p id="msg">A fotó átadása a Google Lens-nek…</p>
  <form id="f" method="POST" action="https://lens.google.com/v3/upload?hl=hu" enctype="multipart/form-data" style="display:none">
    <input type="file" name="encoded_image" id="file">
  </form>
  <script src="/lens-upload.js"></script>
</body>
</html>
